services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: visionguard
      POSTGRES_PASSWORD: visionguard
      POSTGRES_DB: visionguard
    ports:
      - "5432:5432"
    volumes:
      - vg_pg:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://visionguard:visionguard@postgres:5432/visionguard
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Default stack = Demo Mode. Use docker-compose.live.yml for LIVE DATA MODE.
      USE_MOCK_PROVIDERS: "false"
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      OPENWEATHER_QUERY: ${OPENWEATHER_QUERY:-Bengaluru,IN}
      DEMO_LATITUDE: ${DEMO_LATITUDE:-12.9716}
      DEMO_LONGITUDE: ${DEMO_LONGITUDE:-77.5946}
      AOI_NAME: ${AOI_NAME:-Karnataka / Bengaluru (India)}
      NASA_POWER_ENABLED: "true"
      IMD_API_KEY: ${IMD_API_KEY:-}
      COPERNICUS_CLIENT_ID: ${COPERNICUS_CLIENT_ID:-}
      COPERNICUS_CLIENT_SECRET: ${COPERNICUS_CLIENT_SECRET:-}
      COPERNICUS_STAC_URL: ${COPERNICUS_STAC_URL:-https://stac.dataspace.copernicus.eu/v1}
      GIS_OVERPASS_ENABLED: "true"
      MAX_UPLOAD_MB: "8"
      YOLO_WEIGHTS_PATH: ""
      ENABLE_REAL_EMAIL: "false"
      ENABLE_REAL_SMS: "false"
      ENABLE_REAL_PUSH: "false"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_MOCK: "false"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  vg_pg:
